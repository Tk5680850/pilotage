name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Open-ended questions and early ideas fit better in [Discussions](https://github.com/Ya-zid/pilotage/discussions).
        Pilotage is built for one person on their own computer, reads the agents' files read-only and keeps its server on 127.0.0.1. Ideas that change those rules need a strong reason.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you were trying to do, and what got in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the change. Mock-ups and examples are welcome (fictional data only).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to get the same result, including workarounds you use today.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Which platforms does this concern?
      multiple: true
      options:
        - WSL2 on Windows
        - Linux
        - macOS
        - Phone
        - All
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I'd like to open a pull request"
        - "Maybe, with some guidance"
        - "No, just suggesting"
    validations:
      required: true
